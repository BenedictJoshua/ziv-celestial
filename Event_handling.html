<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function convert(value){
            let number = document.querySelector('.number').value;
            let result = parseInt(number) ** 2
            document.getElementById('output').innerHTML = "Square:" + result;
        }
    </script>
</head>
<body>
    <label> Number:</label>
    <input type="number" class="number" oninput="convert()"> <br><br>
    <div id="output"></div>
</body>
</html>
